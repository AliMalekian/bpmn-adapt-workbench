[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpmn-adapt"
version = "0.1.0"
description = "Auditable multi-agent runtime BPMN adaptation research platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "lxml>=5.4,<7",
  "networkx>=3.4,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "platformdirs>=4.3,<5",
  "pm4py>=2.7.16,<3",
  "scipy>=1.15,<2",
  "sentence-transformers>=4.1,<6",
  "statsmodels>=0.14.4,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1"]
dev = [
  "coverage>=7.8,<8",
  "hypothesis>=6.130,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
bpmn-adapt = "bpmn_adapt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpmn_adapt = [
  "prompts/*.md",
  "bpmn/schemas/*.xsd",
  "bpmn/schemas/*.json",
  "bpmn/schemas/*.md",
  "persistence/migrations/*.sql",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
